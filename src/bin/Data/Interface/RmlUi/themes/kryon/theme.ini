; Kryon theme: the warm obsidian and gilded-bronze interface of the OpenMU
; browser stack's loading/analysis shell. It inherits modern's complete layout
; and RML forks; this folder supplies the Kryon palette, bundled serif face and
; the shared chrome pass.
[Theme]
Base=modern

; Gelasio is metric-compatible with Georgia (the analysis shell's face) and is
; bundled under OFL, so the WASM build gets the same serif the native client
; does. It is loaded from this theme's own folder, which the asset packager
; includes in the VFS.
[Fonts]
KryonSerif=fonts/Gelasio-Regular.ttf
KryonSerifBold=fonts/Gelasio-Bold.ttf

[Meta]
DisplayName=Kryon
