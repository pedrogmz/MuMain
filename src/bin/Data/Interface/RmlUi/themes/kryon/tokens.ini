; Kryon design tokens. The palette is taken from the OpenMU browser stack's
; loading/analysis shell: warm obsidian, gilded bronze, parchment text, and a
; serif display face. Keys not set here inherit from modern.
;
; What each token means is in README.md beside this file; keep the two in step.
[Tokens]

; Surfaces -- the loader's panels are warm near-black plates, not cold iron.
surface-deep=#050403
surface-backdrop=rgba(1, 3, 6, 158)
surface-recessed=#0b0806
surface-panel=#15100c
surface-raised=#241a12
surface-control=rgba(255, 226, 156, 12)
surface-tooltip=rgba(8, 6, 4, 245)

; Metal / frame -- bronze is the visible gilding; the warmer values are catches
; on a raised edge, not general-purpose fills.
metal-dark=#17110c
metal-mid=#7a5429
metal-edge=#c08a44
metal-highlight=#ffd988
metal-warm-edge=#e0b158
metal-outer=#050403
metal-groove=#1c1510
metal-rail=#2a1e14
metal-rail-dark=#0b0806
metal-title-face=#3a2411
metal-title-face-dark=#160b04

; Text -- warm parchment and old gold, as in the loader/command deck.
text-primary=#f7e5bd
text-secondary=#d8c59e
text-muted=#9a8564
text-warm=#ffe4a3
text-disabled=#5c4a33

; Accents -- gold is the theme's hero accent. Green marks the running/active
; state (the analysis helper), ember marks danger, steel is muted interaction.
accent-steel=#6b4a2a
accent-steel-hover=#f6dca2
accent-crimson=#8f3828
accent-crimson-hover=#e24436
accent-gold=#e0b158
accent-gold-hover=#ffd988

; Semantic colors -- state/meaning, never decoration.
semantic-success=#8fe5a7
semantic-warning=#ffd944
semantic-danger=#e24436
semantic-rare=#c58cff
semantic-neutral=#8a765a

; Borders -- border-frame is a muted bronze; panel frames use the brighter
; metal-edge / explicit gold rings in base.rcss.
border-frame=#8a5f2e
border-inner=#3a2b1c
border-recessed=#2a1f15
border-hover=#ffd988
border-selected=#ffe4a3
border-outer=#241a12
border-rail=#6b4a2a
border-title=#b08248

; HUD resources -- the analysis UI's own palette: red HP, blue MP, purple AG,
; gold SD.
resource-hp=#b83a2a
resource-mp=#2f6fd0
resource-sd=#ffd944
resource-ag=#bb64ff

; Rounded, jewelled plates rather than modern's sharp iron.
radius-sm=6
radius-md=14

; Typography -- titles and buttons keep Gelasio (metric-compatible with Georgia,
; bundled under OFL so native and WASM match); body text is the bundled
; Liberation Sans, as the web client sets rows and values in a sans face. The
; player's [UI] Font choice still overrides both tokens when available.
font-title=Gelasio
font-body=Liberation Sans

; Server list (Data/Local/ServerList.json) -- the command deck's gold family.
server-button=#ffe4a3
server-button-gray=#c9b39a
server-button-orange=#f0a95c
server-button-silver=#d8dde4
server-load-base=#8fe5a7
server-load-full=#e24436
server-load-empty=#050403
